name: Network Validator CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile C++ application
        run: g++ src/network_validator.cpp -o network_validator.exe -static

      - name: Run automated tests
        run: python -m pytest -v --junitxml=reports/test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-report
          path: reports/test-results.xml

